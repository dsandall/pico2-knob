[package]
name = "pico2-knob-fw"
version = "0.1.0"
edition = "2024"
description = "Bring-up firmware for the pico2-knob / pico2joy puck (nice!nano v2, nRF52840)"
license = "MIT OR Apache-2.0"

[features]
# The connectable link is the default: the puck's whole point is being wireless,
# and the host relay follows it over BLE for as long as it is powered. The
# broadcast-only build is still here (`./build.sh --no-ble`) as the small,
# simple fallback - it is a quarter of the flash and has no radio stack to go
# wrong - but it cannot accept a connection, so nothing above it works.
default = ["ble"]

# Critical sections: the plain single-core implementation is right for the
# broadcast-only build, but MPSL needs its own (blanket interrupt masking would
# wreck radio timing). They are mutually exclusive - enabling both links two
# implementations - hence a feature for each, and
# `--no-default-features --features cs-single-core` for the build without a
# radio stack.
cs-single-core = ["cortex-m/critical-section-single-core"]

# Connectable BLE link: trouble-host on the Nordic SoftDevice Controller. Takes
# over RADIO, so it replaces the raw advertiser in src/radio.rs rather than
# joining it.
ble = [
    "dep:nrf-mpsl",
    "dep:nrf-sdc",
    "dep:trouble-host",
    "dep:static_cell",
    "nrf-mpsl/critical-section-impl",
]
# Link the app at 0x001000 instead of 0x026000 (i.e. over the SoftDevice slot).
# Only needed if the installed UF2 bootloader has no SoftDevice; see README.
app-offset-1000 = []
trouble-host = ["dep:trouble-host"]
nrf-sdc = ["dep:nrf-sdc"]
nrf-mpsl = ["dep:nrf-mpsl"]
static_cell = ["dep:static_cell"]
rand_core = []

[dependencies]
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = [
    "nrf52840",
    "rt",
    "time-driver-rtc1",
    "nfc-pins-as-gpio",  # frees P0.09/P0.10 (encoder A/B) from the NFC antenna block
    "unstable-pac",      # POWER.GPREGRET, for the "reboot into bootloader" command
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-graphics = "0.8.2"
heapless = "0.9.3"
libm = "0.2.16"
nrf-mpsl = { version = "0.4.0", optional = true, default-features = false, features = ["nrf52840"] }
nrf-sdc = { version = "0.4.0", optional = true, default-features = false, features = ["nrf52840", "peripheral"] }
static_cell = { version = "2.1.1", optional = true }
trouble-host = { version = "0.8.0", optional = true, default-features = false, features = [
    "peripheral",
    "gatt",
    "derive",
    "default-packet-pool",
] }

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev]
opt-level = 1
