[package]
name = "pico2-knob-fw"
version = "0.1.0"
edition = "2024"
description = "Bring-up firmware for the pico2-knob / pico2joy puck (nice!nano v2, nRF52840)"
license = "MIT OR Apache-2.0"

[features]
default = []
# Link the app at 0x001000 instead of 0x026000 (i.e. over the SoftDevice slot).
# Only needed if the installed UF2 bootloader has no SoftDevice; see README.
app-offset-1000 = []

[dependencies]
cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = [
    "nrf52840",
    "rt",
    "time-driver-rtc1",
    "nfc-pins-as-gpio",  # frees P0.09/P0.10 (encoder A/B) from the NFC antenna block
    "unstable-pac",      # POWER.GPREGRET, for the "reboot into bootloader" command
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-graphics = "0.8.2"
heapless = "0.9.3"
panic-halt = "1.0.0"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev]
opt-level = 1
